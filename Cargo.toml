[package]
name = "brewake"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny open-source Windows utility that keeps your computer awake."
license = "MIT"
readme = "README.md"
repository = "https://github.com/thanhbican/brewake"
homepage = "https://github.com/thanhbican/brewake"
documentation = "https://github.com/thanhbican/brewake#readme"
keywords = ["windows", "awake", "tray", "utility"]
categories = ["os::windows-apis"]

[lib]
name = "brewake"
path = "src/lib.rs"

[[bin]]
name = "brewake"
path = "src/main.rs"

[[bin]]
name = "brewakectl"
path = "src/bin/brewakectl.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.winresource]
ProductName = "Brewake"
FileDescription = "Brewake keep-awake utility"
LegalCopyright = "Copyright © 2026 Brewake contributors"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
